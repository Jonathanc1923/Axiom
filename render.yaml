services:
  - type: web
    name: axiom-algorithmic
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: TOPSTEP_USERNAME
        sync: false
      - key: TOPSTEP_API_KEY
        sync: false
      - key: TOPSTEP_BASE_URL
        value: https://api.topstepx.com
      - key: ACCOUNT_FILTER
        value: PRAC
      - key: ACCOUNT_NAME
        value: PRAC-V2-460183-28640537
      - key: DEFAULT_SYMBOL
        value: ES
      - key: AUTO_START_ENGINE
        value: "true"
      - key: VWAP_SLOPE_LOOKBACK_BARS
        value: "7"
      - key: MIN_SLOPE_POINTS_ES
        value: "1.0"
      - key: MIN_SLOPE_POINTS_NQ
        value: "1.5"
      - key: MIN_SLOPE_POINTS_YM
        value: "2.0"
      - key: MIN_SLOPE_POINTS_RTY
        value: "0.30"
      - key: MIN_SLOPE_POINTS_OIL
        value: "0.03"
      - key: MIN_SLOPE_POINTS_GOLD
        value: "1.0"
      - key: CME_OPEN_BUFFER_MINUTES
        value: "120"
      - key: SESSION_START_HOUR_PERU
        value: "19"
      - key: SESSION_START_MINUTE_PERU
        value: "0"
      - key: TRAILING_DAILY_PROFIT_TRIGGER_USD
        value: "750.0"
      - key: TRAILING_DAILY_PROFIT_RETAIN_PCT
        value: "0.70"
