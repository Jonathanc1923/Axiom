<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="axiomGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="axiomGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="axiomGrad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Filter for Quantum Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Quant Monogram (Axiom Alpha Delta) -->
  <g transform="translate(10, 10)">
    <!-- Outer Hex Shield Nodes (Subtle institutional grid) -->
    <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- Central Geometric 'A' Prism Structure -->
    <!-- Left Leg -->
    <path d="M 50,14 L 18,76 L 32,76 L 50,38 Z" fill="url(#axiomGrad1)" filter="url(#neonGlow)"/>
    
    <!-- Right Leg -->
    <path d="M 50,14 L 82,76 L 68,76 L 50,38 Z" fill="url(#axiomGrad3)"/>
    
    <!-- Quantum Crossbar / Vector Bridge -->
    <path d="M 33,56 L 67,56 L 61,64 L 39,64 Z" fill="url(#axiomGrad2)"/>
    
    <!-- Core Alpha Apex Node -->
    <circle cx="50" cy="14" r="3.5" fill="#00F2FE" filter="url(#neonGlow)"/>
    
    <!-- Pulse Vector Lines (representing order flow) -->
    <circle cx="18" cy="76" r="2.5" fill="#10B981" />
    <circle cx="82" cy="76" r="2.5" fill="#3B82F6" />
    <circle cx="50" cy="56" r="2" fill="#FFFFFF" />
  </g>

  <!-- Typography: AXIOM ALGORITHMIC -->
  <!-- AXIOM -->
  <text x="125" y="62" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#FFFFFF">
    AXIOM
  </text>
  <!-- Accent Dot / Metric Indicator -->
  <circle cx="318" cy="46" r="4" fill="#00F2FE" filter="url(#neonGlow)"/>

  <!-- ALGORITHMIC Subtitle -->
  <text x="126" y="86" font-family="'JetBrains Mono', 'Roboto Mono', monospace" font-size="13" font-weight="600" letter-spacing="7" fill="#94A3B8">
    ALGORITHMIC
  </text>

  <!-- Institutional Tag Badge -->
  <g transform="translate(350, 42)">
    <rect x="0" y="0" width="145" height="24" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#10B981"/>
    <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#38BDF8" letter-spacing="1">QUANT ENGINE</text>
  </g>
</svg>
